<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#161826"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Purple Violet Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Center Bridge Gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- Subtle Corner Tech Accents -->
  <path d="M 8 18 L 8 10 L 18 10" fill="none" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 56 46 L 56 54 L 46 54" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 3D Monogram "M" -->
  <g filter="url(#glow)">
    <!-- Left Column -->
    <path d="M 14 48 L 14 18 L 22 18 L 22 48 Z" fill="url(#cyanGrad)"/>
    <!-- Left Angled Facet -->
    <path d="M 14 18 L 22 18 L 32 32 L 27 34 Z" fill="url(#centerGrad)" opacity="0.95"/>
    
    <!-- Right Angled Facet -->
    <path d="M 50 18 L 42 18 L 32 32 L 37 34 Z" fill="url(#purpleGrad)" opacity="0.95"/>
    <!-- Right Column -->
    <path d="M 42 18 L 50 18 L 50 48 L 42 48 Z" fill="url(#purpleGrad)"/>

    <!-- Center Apex Shard -->
    <polygon points="32,25 37,33 32,40 27,33" fill="#ffffff" opacity="0.95"/>
    
    <!-- Cyber Nodes -->
    <circle cx="18" cy="48" r="2" fill="#00f2fe"/>
    <circle cx="46" cy="48" r="2" fill="#c084fc"/>
    <circle cx="32" cy="25" r="2" fill="#ffffff"/>
  </g>
</svg>